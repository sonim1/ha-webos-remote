name: Publish GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r lg_webos_remote/requirements.txt pyyaml
      - name: Verify version tag
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run verify
      - uses: hacs/action@main
        with:
          category: plugin
          comment: false
      - run: python scripts/package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(--title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ha-webos-remote.js .release/*.zip "${args[@]}"
