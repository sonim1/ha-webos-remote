name: Publish GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify version tag
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run verify
      - run: python scripts/package.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(--title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ha-webos-remote.js .release/*.zip "${args[@]}"
