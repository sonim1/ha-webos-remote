name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: Source and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r lg_webos_remote/requirements.txt pyyaml
      - run: npm run build
      - run: npm run verify
      - run: |
          python -m py_compile lg_webos_remote/server.py lg_webos_remote/protocol.py lg_webos_remote/pairing.py lg_webos_remote/pointer_session.py
          python scripts/package.py
      - run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          meta = yaml.safe_load(Path('repository.yaml').read_text())
          addon = yaml.safe_load(Path('lg_webos_remote/config.yaml').read_text())
          assert meta['name']
          assert addon['slug'] == 'lg_webos_remote'
          assert addon['version'] == Path('VERSION').read_text().strip()
          assert addon['host_network'] is True
          print('App manifest validated')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
  hacs:
    name: HACS structure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
          comment: false
