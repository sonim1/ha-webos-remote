name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/remote-preview.png'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/remote-preview.png'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    name: Check and deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Type-check deployment configuration
        run: npm run typecheck
      - name: Build website once
        run: npm run build -- --mode production
      - name: Validate built deployment without credentials
        run: npx --no-install cf deploy --prebuilt --mode production --dry-run
      - name: Deploy main to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See website/README.md.'
            exit 1
          fi
          npx --no-install cf deploy --prebuilt --mode production --no-provision
      - name: Verify public website and assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://webos.royjen.com/ -o "$RUNNER_TEMP/website.html"
          cmp dist/index.html "$RUNNER_TEMP/website.html"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://webos.royjen.com/assets/home-assistant.svg -o "$RUNNER_TEMP/home-assistant.svg"
          cmp dist/assets/home-assistant.svg "$RUNNER_TEMP/home-assistant.svg"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://webos.royjen.com/docs/remote-preview.png -o "$RUNNER_TEMP/remote-preview.png"
          cmp dist/docs/remote-preview.png "$RUNNER_TEMP/remote-preview.png"
